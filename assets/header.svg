<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bowen Wei — Java Backend and AI Agent Developer</title>
  <desc id="desc">Graphite engineering workspace with warm white text, restrained amber accents, a subtle animated signal, and a connected backend and agent workflow.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="388" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .signal { animation: signal 3s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 9; animation: flow 8s linear infinite; }
      .cursor { animation: cursor 1.4s steps(1) infinite; }
      @keyframes signal { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      @keyframes flow { to { stroke-dashoffset:-84; } }
      @keyframes cursor { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { .signal,.flow,.cursor { animation:none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="#181818"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <path d="M50 1H1150" stroke="#3C3C3C" stroke-width="2"/>
    <path d="M50 1H180" stroke="#D8A657" stroke-width="3"/>
    <g class="mono" font-size="13" letter-spacing="2">
      <circle cx="54" cy="49" r="4" fill="#D8A657" class="signal"/>
      <text x="69" y="54" fill="#ADAAA3">ONEUTER / ENGINEERING IN PROGRESS</text>
    </g>
    <text x="49" y="137" class="sans" font-size="68" font-weight="700" letter-spacing="-2" fill="#F3F0E8">Bowen Wei<tspan fill="#D8A657">.</tspan></text>
    <text x="53" y="179" class="sans" font-size="24" fill="#DEDAD2">Java Backend &amp; AI Agent Developer</text>
    <text x="53" y="215" class="sans" font-size="17" fill="#ADAAA3">Backend foundations. Agent possibilities.</text>
    <rect x="53" y="245" width="180" height="34" rx="7" fill="#2A251D" stroke="#635139"/>
    <rect x="245" y="245" width="206" height="34" rx="7" fill="#232323" stroke="#444444"/>
    <text x="68" y="267" class="mono" font-size="12" font-weight="700" letter-spacing=".6" fill="#E1B875">JAVA / SPRING BOOT</text>
    <text x="262" y="267" class="mono" font-size="12" font-weight="700" letter-spacing=".6" fill="#D4D1CB">AGENTS / RAG / MCP</text>
    <rect x="708" y="60" width="442" height="252" rx="15" fill="#141414" stroke="#3C3C3C"/>
    <path d="M709 99H1149" stroke="#333333"/>
    <circle cx="729" cy="80" r="4" fill="#77736E"/><circle cx="744" cy="80" r="4" fill="#A8A29A"/><circle cx="759" cy="80" r="4" fill="#D8A657"/>
    <text x="784" y="84" class="mono" font-size="11" fill="#ADAAA3">backend-agent.workspace</text>
    <text x="730" y="125" class="mono" font-size="10" letter-spacing="1.2" fill="#ADAAA3">LEARNING TO CONNECT THE PIECES</text>
    <path d="M842 171H893M991 171H1096V225M842 249H893M991 249H1055" stroke="#505050" stroke-width="1.5"/>
    <path d="M842 171H893M991 171H1096V225M842 249H893M991 249H1055" class="flow" stroke="#D8A657" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="m887 167 6 4-6 4m203 48 6 6 6-6m-53 22 6 4-6 4" stroke="#D8A657" stroke-opacity=".8" stroke-width="1.5"/>
    <rect x="730" y="147" width="112" height="48" rx="9" fill="#242424" stroke="#505050"/>
    <text x="786" y="176" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#E5E1D9">API</text>
    <rect x="893" y="147" width="98" height="48" rx="9" fill="#242424" stroke="#505050"/>
    <text x="942" y="176" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#E5E1D9">SERVICE</text>
    <text x="1042" y="157" class="mono" font-size="10" fill="#ADAAA3">CONTEXT</text>
    <rect x="730" y="225" width="112" height="48" rx="9" fill="#242424" stroke="#505050"/>
    <text x="786" y="254" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#E5E1D9">AGENT</text>
    <rect x="893" y="225" width="98" height="48" rx="9" fill="#242424" stroke="#505050"/>
    <text x="942" y="254" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#E5E1D9">TOOLS</text>
    <rect x="1055" y="225" width="74" height="48" rx="9" fill="#2A251D" stroke="#635139"/>
    <text x="1092" y="244" text-anchor="middle" class="mono" font-size="11" fill="#E1B875">RAG</text>
    <text x="1092" y="260" text-anchor="middle" class="mono" font-size="11" fill="#E1B875">MCP</text>
    <text x="730" y="295" class="mono" font-size="10" fill="#9C9993">// build · test · evaluate · iterate</text>
    <path d="M53 330H1150" stroke="#373737"/>
    <text x="53" y="359" class="mono" font-size="14" fill="#D8A657">$</text>
    <text x="72" y="359" class="mono" font-size="14" fill="#ADAAA3">build things that actually work</text>
    <rect x="334" y="347" width="8" height="15" rx="1" fill="#D8A657" class="cursor"/>
    <text x="1148" y="359" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#ADAAA3">JAVA FIRST. AGENTS NEXT. ALWAYS BUILDING.</text>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="22" stroke="#3C3C3C"/>
</svg>
