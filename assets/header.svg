<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bowen Wei — Java Backend and AI Agent Developer</title>
  <desc id="desc">Dark navy engineering dashboard with cyan and violet accents, a subtle animated signal, and a connected backend and agent workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/><stop offset=".55" stop-color="#10182A"/><stop offset="1" stop-color="#17172E"/>
    </linearGradient>
    <linearGradient id="accent" x1="50" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/><stop offset=".48" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6366F1" stop-opacity=".2"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#334155" stroke-opacity=".21"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="388" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .signal { animation: signal 3s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 9; animation: flow 6s linear infinite; }
      .cursor { animation: cursor 1.4s steps(1) infinite; }
      @keyframes signal { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      @keyframes flow { to { stroke-dashoffset:-84; } }
      @keyframes cursor { 0%,55% { opacity:1; } 56%,100% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { .signal,.flow,.cursor { animation:none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <ellipse cx="1060" cy="185" rx="370" ry="310" fill="url(#halo)"/>
    <path d="M50 1H1150" stroke="url(#accent)" stroke-width="3"/>
    <path d="M660 0 570 390" stroke="#526580" stroke-opacity=".16"/>
    <g class="mono" font-size="13" letter-spacing="2">
      <circle cx="54" cy="49" r="4" fill="#67E8F9" class="signal"/>
      <text x="69" y="54" fill="#A6B8CE">ONEUTER / ENGINEERING IN PROGRESS</text>
    </g>
    <text x="49" y="137" class="sans" font-size="68" font-weight="700" letter-spacing="-2" fill="#F0F6FC">Bowen Wei<tspan fill="#67E8F9">.</tspan></text>
    <text x="53" y="179" class="sans" font-size="24" fill="#D2DEEC">Java Backend &amp; AI Agent Developer</text>
    <text x="53" y="215" class="sans" font-size="17" fill="#93A6BE">Backend foundations. Agent possibilities.</text>
    <rect x="53" y="245" width="180" height="34" rx="7" fill="#0D2637" stroke="#23516A"/>
    <rect x="245" y="245" width="206" height="34" rx="7" fill="#24213F" stroke="#4A3C70"/>
    <text x="68" y="267" class="mono" font-size="12" font-weight="700" letter-spacing=".6" fill="#7DD3FC">JAVA / SPRING BOOT</text>
    <text x="262" y="267" class="mono" font-size="12" font-weight="700" letter-spacing=".6" fill="#C4B5FD">AGENTS / RAG / MCP</text>
    <rect x="708" y="60" width="442" height="252" rx="15" fill="#0B1220" stroke="#303A53"/>
    <path d="M709 99H1149" stroke="#26344A"/>
    <circle cx="729" cy="80" r="4" fill="#F87171"/><circle cx="744" cy="80" r="4" fill="#FBBF24"/><circle cx="759" cy="80" r="4" fill="#34D399"/>
    <text x="784" y="84" class="mono" font-size="11" fill="#8EA3BE">backend-agent.workspace</text>
    <text x="730" y="125" class="mono" font-size="10" letter-spacing="1.2" fill="#8EA3BE">LEARNING TO CONNECT THE PIECES</text>
    <path d="M842 171H893M991 171H1096V225M842 249H893M991 249H1055" stroke="#38506D" stroke-width="1.5"/>
    <path d="M842 171H893M991 171H1096V225M842 249H893M991 249H1055" class="flow" stroke="#67E8F9" stroke-opacity=".8" stroke-width="1.5"/>
    <path d="m887 167 6 4-6 4m203 48 6 6 6-6m-53 22 6 4-6 4" stroke="#67E8F9" stroke-opacity=".8" stroke-width="1.5"/>
    <rect x="730" y="147" width="112" height="48" rx="9" fill="#112B3A" stroke="#276078"/>
    <text x="786" y="176" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#7DD3FC">API</text>
    <rect x="893" y="147" width="98" height="48" rx="9" fill="#112B3A" stroke="#276078"/>
    <text x="942" y="176" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#7DD3FC">SERVICE</text>
    <text x="1042" y="157" class="mono" font-size="10" fill="#8EA3BE">CONTEXT</text>
    <rect x="730" y="225" width="112" height="48" rx="9" fill="#25213E" stroke="#57447A"/>
    <text x="786" y="254" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#C4B5FD">AGENT</text>
    <rect x="893" y="225" width="98" height="48" rx="9" fill="#25213E" stroke="#57447A"/>
    <text x="942" y="254" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#C4B5FD">TOOLS</text>
    <rect x="1055" y="225" width="74" height="48" rx="9" fill="#152C31" stroke="#2B626C"/>
    <text x="1092" y="244" text-anchor="middle" class="mono" font-size="11" fill="#99F6E4">RAG</text>
    <text x="1092" y="260" text-anchor="middle" class="mono" font-size="11" fill="#99F6E4">MCP</text>
    <text x="730" y="295" class="mono" font-size="10" fill="#7F94AF">// build · test · evaluate · iterate</text>
    <path d="M53 330H1150" stroke="#2D3C53"/>
    <text x="53" y="359" class="mono" font-size="14" fill="#67E8F9">$</text>
    <text x="72" y="359" class="mono" font-size="14" fill="#A6B8CE">build things that actually work</text>
    <rect x="334" y="347" width="8" height="15" rx="1" fill="#67E8F9" class="cursor"/>
    <text x="1148" y="359" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#8EA3BE">JAVA FIRST. AGENTS NEXT. ALWAYS BUILDING.</text>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="22" stroke="#33405A"/>
</svg>
